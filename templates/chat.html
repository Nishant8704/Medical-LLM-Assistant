<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical LLM Assistant</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css')}}"/>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar (Optional aesthetic addition) -->
        <div class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-notes-medical"></i>
                <span>MedAssist AI</span>
            </div>
            <div class="nav-links">
                <a href="#" class="active"><i class="fa-solid fa-comment-medical"></i> Consultation</a>
                <a href="#"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
                <a href="#"><i class="fa-solid fa-gear"></i> Settings</a>
            </div>
            <div class="disclaimer">
                <p><i class="fa-solid fa-circle-exclamation"></i> For informational purposes only. Not medical advice.</p>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-container">
            <div class="chat-header">
                <div class="header-info">
                    <div class="avatar-container">
                        <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" alt="Bot Avatar" class="avatar">
                        <span class="status-dot"></span>
                    </div>
                    <div class="header-text">
                        <h2>Medical Assistant</h2>
                        <p>Powered by LLM</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="icon-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                </div>
            </div>
            
            <div id="chat-messages" class="chat-messages">
                <div class="message bot-message fade-in">
                    <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" alt="Bot" class="msg-avatar">
                    <div class="msg-bubble">
                        <p>Hello! I'm your Medical AI Assistant. How can I help you today?</p>
                        <span class="msg-time">Just now</span>
                    </div>
                </div>
            </div>
            
            <div class="typing-indicator" id="typing-indicator" style="display: none;">
                <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" alt="Bot" class="msg-avatar">
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <div class="chat-input-container">
                <form id="messageArea" class="input-form">
                    <button type="button" class="icon-btn attachment-btn"><i class="fa-solid fa-paperclip"></i></button>
                    <input type="text" id="text" name="msg" placeholder="Type your medical query here..." autocomplete="off" required/>
                    <button type="submit" id="send" class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
                </form>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            function formatTime() {
                const date = new Date();
                let hours = date.getHours();
                let minutes = date.getMinutes();
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12; 
                minutes = minutes < 10 ? '0' + minutes : minutes;
                return hours + ':' + minutes + ' ' + ampm;
            }

            function scrollToBottom() {
                const chatMessages = document.getElementById("chat-messages");
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            $("#messageArea").on("submit", function(event) {
                event.preventDefault();
                
                const rawText = $("#text").val().trim();
                if(!rawText) return;
                
                const str_time = formatTime();
                
                // Add user message
                const userHtml = `
                    <div class="message user-message fade-in">
                        <div class="msg-bubble">
                            <p>${rawText}</p>
                            <span class="msg-time">${str_time}</span>
                        </div>
                    </div>`;
                
                $("#text").val("");
                $("#chat-messages").append(userHtml);
                scrollToBottom();

                // Show typing indicator
                $("#typing-indicator").show();
                scrollToBottom();

                // Send request
                $.ajax({
                    data: { msg: rawText },
                    type: "POST",
                    url: "/get",
                }).done(function(data) {
                    $("#typing-indicator").hide();
                    
                    const botTime = formatTime();
                    // Process newlines to <br> for better formatting
                    const formattedData = data.replace(/\n/g, '<br>');
                    
                    const botHtml = `
                        <div class="message bot-message fade-in">
                            <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" alt="Bot" class="msg-avatar">
                            <div class="msg-bubble">
                                <p>${formattedData}</p>
                                <span class="msg-time">${botTime}</span>
                            </div>
                        </div>`;
                        
                    $("#chat-messages").append(botHtml);
                    scrollToBottom();
                }).fail(function() {
                    $("#typing-indicator").hide();
                    const errorHtml = `
                        <div class="message bot-message fade-in">
                            <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" alt="Bot" class="msg-avatar">
                            <div class="msg-bubble error-bubble">
                                <p>Sorry, I encountered an error connecting to the server.</p>
                                <span class="msg-time">${formatTime()}</span>
                            </div>
                        </div>`;
                    $("#chat-messages").append(errorHtml);
                    scrollToBottom();
                });
            });
        });
    </script>
</body>
</html>
